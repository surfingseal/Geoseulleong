name: Seat Prediction Precompute (Weekday 5m -> R2)

# Run manually when models or input statistics are updated (no daily cron).
on:
  workflow_dispatch:
    inputs:
      model_r2_prefix:
        description: "R2 prefix containing the verified model bundle"
        required: false
        default: "models/seat-per-route-v1"
      output_r2_prefix:
        description: "R2 prefix for precomputed predictions"
        required: false
        default: "predictions/seat-v1"
      expected_model_sha256:
        description: "Optional SHA256 pin for bundle.tar.gz"
        required: false
        default: "3efd9ad8ac6ce5851f03d6fc761f22644b87b6f4043541809982eeb400681c2b"
      verify_parity:
        description: "Run 1m vs 5m parity check before upload"
        required: false
        default: "true"

concurrency:
  group: seat-prediction-precompute
  cancel-in-progress: false

jobs:
  precompute-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "services/seat-prediction/requirements.txt"

      - name: Install pinned ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/seat-prediction/requirements.txt

      - name: Fetch and verify model bundle from Cloudflare R2
        env:
          SEAT_MODEL_ROOT: ${{ runner.temp }}/seat-models
          SEAT_MODEL_R2_PREFIX: ${{ inputs.model_r2_prefix }}
          SEAT_MODEL_EXPECTED_SHA256: ${{ inputs.expected_model_sha256 }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python services/seat-prediction/fetch_models.py

      - name: Generate 280-route weekday 5m predictions and upload atomically to R2
        env:
          SEAT_WORK_ROOT: ${{ runner.temp }}/seat-models
          SEAT_PREDICT_R2_PREFIX: ${{ inputs.output_r2_prefix }}
          SEAT_PRECOMPUTE_UPLOAD: "true"
          SEAT_PRECOMPUTE_VERIFY_PARITY: ${{ inputs.verify_parity }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python services/seat-prediction/batch_precompute_v2.py
